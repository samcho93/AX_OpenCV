<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenCV-Python 5주 강좌</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👁️</text></svg>">

  <!-- 글꼴 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">

  <!-- 코드 에디터 (CodeMirror 5) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/runmode/runmode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/comment/comment.min.js"></script>

  <!-- 브라우저용 Python (Pyodide + opencv-python) -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.29.5/full/pyodide.js"></script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" class="layout">
    <!-- ========== 왼쪽: 네비게이션 ========== -->
    <aside id="nav" class="pane nav">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">
          <span class="dot r"></span><span class="dot g"></span><span class="dot b"></span>
        </div>
        <div>
          <div class="brand-title">OpenCV-Python</div>
          <div class="brand-sub">5주 · 41교시 입문 과정</div>
        </div>
        <button id="themeBtn" class="icon-btn" title="라이트/다크 전환" aria-label="테마 전환">◐</button>
      </div>
      <div class="role-switch" role="group" aria-label="보기 대상">
        <button data-role="student" title="학생용: 문서 형태의 강좌 + 실습">🎓 학생용</button>
        <button data-role="teacher" title="교사용: 요약 슬라이드 + 교사 노트 + 정답 · 타이머">🧑‍🏫 교사용</button>
      </div>
      <div class="progress-wrap">
        <div class="progress-label"><span>학습 진도</span><span id="progressText">0 / 40</span></div>
        <div class="progress"><div id="progressBar" class="progress-fill"></div></div>
      </div>
      <input id="navSearch" class="nav-search" type="search" placeholder="교시·함수 검색 (예: Canny)">
      <nav id="navTree" class="nav-tree"></nav>
    </aside>
    <div class="gutter" data-resize="nav" title="드래그하여 너비 조절"></div>

    <!-- ========== 가운데: 강좌 내용 + 코드 에디터 ========== -->
    <main id="center" class="pane center">
      <div id="content" class="content" tabindex="-1"></div>
      <div class="hgutter" data-resize="editor" title="드래그하여 높이 조절"></div>
      <section id="editorPane" class="editor-pane">
        <div class="editor-bar">
          <span class="editor-title">🧪 실습 코드 <span id="editorLabel" class="muted"></span></span>
          <span class="spacer"></span>
          <button id="foldBtn" class="btn ghost" title="에디터 접기/펼치기 (슬라이드를 크게 보기)">▾ 접기</button>
          <button id="resetBtn" class="btn ghost" title="이 교시의 기본 예제로 되돌리기">↺ 초기화</button>
          <button id="copyBtn" class="btn ghost" title="코드 복사">⧉ 복사</button>
          <button id="stopBtn" class="btn ghost" title="실시간 처리 정지" disabled>■ 정지</button>
          <button id="runBtn" class="btn primary" title="실행 (Ctrl+Enter)" disabled>▶ 실행</button>
        </div>
        <div id="editorHost" class="editor-host"></div>
      </section>
    </main>
    <div class="gutter" data-resize="out" title="드래그하여 너비 조절"></div>

    <!-- ========== 오른쪽: 실행 결과 ========== -->
    <aside id="output" class="pane output">
      <div class="out-head">
        <span class="out-title">실행 결과</span>
        <span id="pyStatus" class="status loading"><span class="pulse"></span><span id="pyStatusText">Python 준비 중…</span></span>
      </div>

      <div class="source-bar">
        <label class="field">
          <span>입력 소스</span>
          <select id="sourceSelect"></select>
        </label>
        <div class="source-actions">
          <button id="camBtn" class="btn small">📷 웹캠 켜기</button>
          <button id="snapBtn" class="btn small ghost" disabled title="현재 웹캠 화면을 webcam.png 로 저장">📸 스냅샷</button>
          <label class="btn small ghost upload" title="내 이미지나 동영상을 실습 환경에 추가">⬆ 업로드<input id="uploadInput" type="file" accept="image/*,video/*" multiple hidden></label>
          <label class="check" title="웹캠 영상을 좌우 반전"><input id="mirrorChk" type="checkbox"> 좌우반전</label>
        </div>
        <div id="camWrap" class="cam-wrap hidden">
          <video id="camVideo" autoplay playsinline muted></video>
          <video id="fileVideo" class="hidden" playsinline muted loop controls preload="auto"></video>
          <div class="cam-meta"><span id="camInfo">-</span><span id="liveInfo" class="live-info"></span></div>
        </div>
        <div id="sourcePreview" class="source-preview"></div>
      </div>

      <div id="trackbars" class="trackbars hidden"></div>
      <div id="windows" class="windows">
        <div class="empty-out">
          <div class="empty-icon">🖼️</div>
          <p><b>▶ 실행</b>을 누르면 <code>cv.imshow()</code> 결과가 여기에 표시됩니다.</p>
          <p class="muted">실시간 처리: <code>def process(frame):</code> 함수를 정의하고 결과 이미지를 <code>return</code> 하세요.</p>
        </div>
      </div>

      <div class="console-wrap">
        <div class="console-bar">
          <span>콘솔</span><span class="spacer"></span>
          <button id="clearConsoleBtn" class="icon-btn small" title="콘솔 지우기">⌫</button>
        </div>
        <pre id="console" class="console"></pre>
      </div>
    </aside>
  </div>

  <div id="lightbox" class="lightbox hidden"><canvas id="lightboxCanvas"></canvas><div class="lightbox-cap" id="lightboxCap"></div></div>

  <!-- 데이터 -->
  <script src="js/images-data.js"></script>
  <script src="js/course.js"></script>
  <script src="lessons/week1.js"></script>
  <script src="lessons/week2.js"></script>
  <script src="lessons/week3.js"></script>
  <script src="lessons/week4.js"></script>
  <script src="lessons/week5.js"></script>
  <!-- 슬라이드(요약 교안) -->
  <script src="js/slides.js"></script>
  <script src="slides/week1.js"></script>
  <script src="slides/week2.js"></script>
  <script src="slides/week3.js"></script>
  <script src="slides/week4.js"></script>
  <script src="slides/week5.js"></script>
  <!-- 실행 환경 -->
  <script src="js/webcv-bridge.js"></script>
  <script src="js/runtime.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
